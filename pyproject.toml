[project]
name = "llm-aphasia"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.13.0",
    "bert-score==0.3.13",
    "datasets==4.8.4",
    "en-core-web-sm",
    "huggingface-hub==1.11.0",
    "matplotlib>=3.10.9",
    "nltk>=3.9.4",
    "numpy>=2.4.4",
    "openpyxl>=3.1",
    "peft>=0.19.1",
    "pyphen>=0.17.2",
    "python-pptx==1.0.2",
    "requests==2.33.1",
    "scikit-learn==1.8.0",
    "seaborn==0.13.2",
    "sentence-transformers>=5.4.1",
    "spacy>=3.8.14",
    "torch==2.7.1",
    "transformer-lens>=3.0.0",
    "transformers==5.5.4",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
